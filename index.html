<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AromaMood | Интернет-магазин парфюмерии</title>
    <style>
        /* Основные цвета и стили сайта (Тренды 2026) */
        :root {
            --bg-color: #0b0b0f;
            --accent-gold: #d4af37;
            --text-white: #ffffff;
            --text-gray: #8a8a93;
            --nav-bg: rgba(11, 11, 15, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
        }

        /* 1. ШАПКА САЙТА (HEADER) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1c1c24;
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-white);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-gold);
        }

        .nav-menu {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-menu a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: var(--accent-gold);
        }

        .cart-icon {
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
        }

        /* 2. ГЛАВНЫЙ БАННЕР (HERO SECTION) */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0b0b0f 100%);
            padding: 0 20px;
            padding-top: 60px; /* отступ для шапки */
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            color: var(--text-gray);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .hero-btn {
            background-color: transparent;
            border: 2px solid var(--accent-gold);
            color: var(--text-white);
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hero-btn:hover {
            background-color: var(--accent-gold);
            color: #0b0b0f;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* Адаптивность для мобильных телефонов */
        @media (max-width: 768px) {
            .nav-menu { display: none; } 
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">Aroma<span>Mood</span></a>
            <ul class="nav-menu">
                <li><a href="#catalog">Каталог</a></li>
                <li><a href="#about">О нас</a></li>
                <li><a href="#contacts">Контакты</a></li>
            </ul>
            <div class="cart-icon">🛒 <span style="color: var(--accent-gold);">0</span></div>
        </div>
    </header>

    <!-- Главный баннер -->
    <section class="hero">
        <div class="hero-content">
            <h1>Откройте мир нишевой и люксовой парфюмерии</h1>
            <p>Эксклюзивная коллекция ароматов 2026 года. Выразите свое настроение через уникальные ноты.</p>
            <button class="hero-btn">Перейти в каталог</button>
        </div>
    </section>

</body>
</html>
