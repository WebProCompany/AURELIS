<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AromaMood | Интернет-магазин парфюмерии</title>
    <style>
        /* Основные цвета и стили сайта (Тренды 2026) */
        :root {
            --bg-color: #0b0b0f;
            --accent-gold: #d4af37;
            --text-white: #ffffff;
            --text-gray: #8a8a93;
            --nav-bg: rgba(11, 11, 15, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
        }

        /* 1. ШАПКА САЙТА (HEADER) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1c1c24;
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-white);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-gold);
        }

        .nav-menu {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-menu a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: var(--accent-gold);
        }

        .cart-icon {
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
        }

        /* 2. ГЛАВНЫЙ БАННЕР (HERO SECTION) */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0b0b0f 100%);
            padding: 0 20px;
            padding-top: 60px; /* отступ для шапки */
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            color: var(--text-gray);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .hero-btn {
            background-color: transparent;
            border: 2px solid var(--accent-gold);
            color: var(--text-white);
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hero-btn:hover {
            background-color: var(--accent-gold);
            color: #0b0b0f;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* Адаптивность для мобильных телефонов */
        @media (max-width: 768px) {
            .nav-menu { display: none; } 
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">Aroma<span>Mood</span></a>
            <ul class="nav-menu">
                <li><a href="#catalog">Каталог</a></li>
                <li><a href="#about">О нас</a></li>
                <li><a href="#contacts">Контакты</a></li>
            </ul>
            <div class="cart-icon">🛒 <span style="color: var(--accent-gold);">0</span></div>
        </div>
    </header>

    <!-- Главный баннер -->
    <section class="hero">
        <div class="hero-content">
            <h1>Откройте мир нишевой и люксовой парфюмерии</h1>
            <p>Эксклюзивная коллекция ароматов 2026 года. Выразите свое настроение через уникальные ноты.</p>
            <button class="hero-btn">Перейти в каталог</button>
        </div>
    </section>

</body>
</html>


    <!-- БЛОК НАСТРОЕНИЙ И ВИТРИНА ТОВАРОВ -->
    <section id="catalog" style="padding: 60px 20px; max-width: 1200px; margin: 0 auto;">
        
        <h2 style="text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;">
            Выбирите своё настроение
        </h2>
        <p style="text-align: center; color: var(--text-gray); margin-bottom: 40px;">
            ИИ подберет идеальные парфюмерные ноты под ваше состояние
        </p>

        <!-- Кнопки переключения настроения -->
        <div class="mood-container">
            <button class="mood-btn active" onclick="filterMood('all')">✨ Все ароматы</button>
            <button class="mood-btn" onclick="filterMood('energy')">⚡ Энергия</button>
            <button class="mood-btn" onclick="filterMood('romance')">❤️ Романтика</button>
            <button class="mood-btn" onclick="filterMood('business')">💼 Статус</button>
            <button class="mood-btn" onclick="filterMood('relax')">🧘 Релакс</button>
        </div>

        <!-- Сетка товаров, которая будет заполняться через JavaScript -->
        <div class="products-grid" id="shop-grid"></div>
    </section>

    <!-- Скрипт логики магазина (JavaScript) -->
    <script>
        // Имитация базы данных товаров
        const products = [
            { id: 1, name: "Neon Citrus", mood: "energy", notes: "Лайм, Бергамот, Зеленый чай", price: "750 сомони", icon: "🍋" },
            { id: 2, name: "Midnight Rose", mood: "romance", notes: "Дамасская роза, Мускус, Ваниль", price: "920 сомони", icon: "🌹" },
            { id: 3, name: "Oud Amber", mood: "business", notes: "Уд, Кожа, Шафран, Сандал", price: "1200 сомони", icon: "🪵" },
            { id: 4, name: "Velvet Lavender", mood: "relax", notes: "Лаванда, Ромашка, Белый мускус", price: "680 сомони", icon: "🪻" },
            { id: 5, name: "Solar Mint", mood: "energy", notes: "Мята, Грейпфрут, Морская соль", price: "710 сомони", icon: "🌿" },
            { id: 6, name: "Amour Intense", mood: "romance", notes: "Жасмин, Пачули, Черная смородина", price: "890 сомони", icon: "🍒" }
        ];

        // Функция вывода товаров на экран
        function renderProducts(filter) {
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? products : products.filter(p => p.mood === filter);

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-image">${p.icon}</div>
                        <div class="product-info">
                            <h3 class="product-name">${p.name}</h3>
                            <div class="product-notes"><b>Ноты:</b> ${p.notes}</div>
                            <div class="product-footer">
                                <span class="product-price">${p.price}</span>
                                <button class="buy-btn" onclick="alert('Товар ${p.name} добавлен в корзину!')">В корзину</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Функция переключения вкладок
        function filterMood(mood) {
            const buttons = document.querySelectorAll('.mood-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Защита от багов при клике
            if(event) {
                event.target.classList.add('active');
            }

            renderProducts(mood);
        }

        // Запуск при загрузке страницы
        renderProducts('all');
    </script>
