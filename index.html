<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AURÉLIS — премиальная коллекция ароматов."
  >

  <meta
    name="theme-color"
    content="#f7f3ee"
  >

  <title>AURÉLIS — Премиальная коллекция ароматов</title>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/header.css">

</head>

<body>

  <!-- ==========================================
       SITE HEADER
  =========================================== -->

  <header class="site-header">

    <div class="header-container">

      <!-- BRAND -->

      <a
        href="./index.html"
        class="brand"
        aria-label="AURÉLIS — Главная"
      >
        AURÉLIS
      </a>


      <!-- DESKTOP NAVIGATION -->

      <nav
        class="desktop-navigation"
        aria-label="Основная навигация"
      >

        <a
          href="./index.html"
          class="navigation-link is-active"
        >
          Главная
        </a>

        <a
          href="./women.html"
          class="navigation-link"
        >
          Женские
        </a>

        <a
          href="./men.html"
          class="navigation-link"
        >
          Мужские
        </a>

        <a
          href="./contacts.html"
          class="navigation-link"
        >
          Контакты
        </a>

      </nav>


      <!-- HEADER ACTION -->

      <a
        href="./contacts.html"
        class="header-action"
      >
        <span>Связаться</span>

        <span
          class="header-action-arrow"
          aria-hidden="true"
        >
          ↗
        </span>
      </a>


      <!-- MOBILE MENU BUTTON -->

      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
        aria-controls="mobile-navigation"
      >

        <span></span>
        <span></span>

      </button>

    </div>


    <!-- MOBILE NAVIGATION -->

    <nav
      class="mobile-navigation"
      id="mobile-navigation"
      aria-label="Мобильная навигация"
      aria-hidden="true"
    >

      <div class="mobile-navigation-inner">

        <div class="mobile-navigation-label">
          MENU
        </div>

        <a
          href="./index.html"
          class="mobile-navigation-link is-active"
        >
          <span>Главная</span>
          <span aria-hidden="true">01</span>
        </a>

        <a
          href="./women.html"
          class="mobile-navigation-link"
        >
          <span>Женские ароматы</span>
          <span aria-hidden="true">02</span>
        </a>

        <a
          href="./men.html"
          class="mobile-navigation-link"
        >
          <span>Мужские ароматы</span>
          <span aria-hidden="true">03</span>
        </a>

        <a
          href="./contacts.html"
          class="mobile-navigation-link"
        >
          <span>Контакты</span>
          <span aria-hidden="true">04</span>
        </a>

      </div>

    </nav>

  </header>


  <!-- ==========================================
       PAGE CONTENT
       Hero will be added next
  =========================================== -->

  <main id="app"></main>


  <script src="./js/main.js" defer></script>

</body>

</html>
